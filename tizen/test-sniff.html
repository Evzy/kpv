<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KPV — Embed engine test (PC)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #111; color: #e5e7eb; }
    h1 { font-size: 1.25rem; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    input { flex: 1; min-width: 280px; padding: 8px; font-size: 14px; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    #status { font-weight: 600; margin: 8px 0; min-height: 1.5em; }
    #ua-hint { font-size: 13px; color: #9ca3af; margin-bottom: 12px; }
    #engine-frame {
      width: 640px; height: 360px; border: 1px solid #374151; background: #000;
    }
    #log {
      margin-top: 12px; padding: 12px; background: #0a0a0a; border: 1px solid #333;
      font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; max-height: 320px; overflow: auto;
    }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>KPV embed engine test</h1>
  <p>
    Runs the <strong>same</strong> fetch → strip ads → blob iframe → JW sniff path as Samsung TV
    <code>sniff.html</code>. If this fails in Chrome, sideloading a new WGT will not fix the TV.
  </p>
  <p id="ua-hint"></p>
  <div class="row">
    <input id="embed-url" type="url" placeholder="Embed URL" />
    <button id="btn-run" type="button">Run test</button>
  </div>
  <p id="status">Idle</p>
  <iframe id="engine-frame" title="Embed engine" allow="autoplay; encrypted-media"></iframe>
  <pre id="log"></pre>
  <p class="small">
    Serve this folder: <code>npm run test:sniff</code> then open
    <a href="http://127.0.0.1:8766/test-sniff.html">test-sniff.html</a>.
  </p>
  <script src="embed-engine.js"></script>
  <script src="test-sniff.js"></script>
</body>
</html>
