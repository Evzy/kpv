<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>KPV — Player</title>
  <link rel="stylesheet" href="style.css" />
  <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #msg {
      display: flex; position: fixed; inset: 0; align-items: center; justify-content: center;
      color: #e5e7eb; font: 24px system-ui, sans-serif; text-align: center; padding: 48px;
      background: rgba(0,0,0,0.8); z-index: 2;
    }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 20px; text-align: center; z-index: 3;
      color: #e5e7eb; font: 20px system-ui, sans-serif; font-weight: 600;
      text-shadow: 0 2px 10px #000;
    }
  </style>
  <script src="hls.min.js"></script>
  <script src="tv-keys.js"></script>
  <script src="watch-controls.js"></script>
  <script src="chat-overlay.js"></script>
</head>
<body tabindex="0">
  <video id="v" autoplay playsinline></video>
  <div id="msg">Loading stream…</div>
  <p id="hint" class="hidden" aria-hidden="true"></p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var u = params.get("url") || "";
      var title = params.get("t") || "Stream";
      var v = document.getElementById("v");
      var msg = document.getElementById("msg");
      var hint = document.getElementById("hint");

      var watch = {};
      try {
        watch = JSON.parse(sessionStorage.getItem("kpv_watch") || "{}");
      } catch (e) {}
      var sources = Array.isArray(watch.sources) && watch.sources.length > 1 ? watch.sources : [];
      var si = Number(watch.si) || 0;
      var chat = null;
      var controls = null;

      function exit() {
        if (chat) chat.stop();
        window.location.href = "index.html";
      }

      function togglePause() {
        if (v.paused) {
          v.play().catch(function () {});
          controls && controls.setLabel("pause", "Pause");
          controls && controls.setSticky(false);
        } else {
          v.pause();
          if (controls) {
            controls.setLabel("pause", "Play");
            controls.setSticky(true);
            controls.show();
          }
        }
      }

      function pickSource(i) {
        if (i === si) return;
        var s = sources[i];
        watch.si = i;
        watch.uri = s.uri;
        watch.u = s.iframe || "";
        watch.hls = "";
        try {
          sessionStorage.setItem("kpv_watch", JSON.stringify(watch));
        } catch (e) {}
        if (chat) chat.stop();
        window.location.replace("watch.html");
      }

      if (typeof WatchControls !== "undefined") {
        var buttons = [
          { id: "pause", label: "Pause", onSelect: togglePause },
          { id: "stop", label: "Stop", onSelect: exit },
        ];
        if (sources.length) {
          buttons.push({
            id: "sources",
            label: "Sources",
            onSelect: function () {
              controls.choose("Sources", sources.map(function (s) { return s.label; }), si, pickSource);
            },
          });
        }
        if (Number(watch.id) && typeof ChatOverlay !== "undefined") {
          chat = ChatOverlay.create(Number(watch.id));
          buttons.push({
            id: "chat",
            label: "Chat",
            onSelect: function () {
              controls.setLabel("chat", chat.toggle() ? "Hide chat" : "Chat");
            },
          });
        }
        controls = WatchControls.create(buttons);
      }

      function onKey(e) {
        if (e.keyCode === 10009 || e.key === "Back" || e.key === "Escape") {
          e.preventDefault();
          e.stopPropagation();
          if (controls && controls.closePicker()) return;
          exit();
          return;
        }
        if (typeof TvKeys !== "undefined" && TvKeys.isPlayPause(e)) {
          e.preventDefault();
          e.stopPropagation();
          togglePause();
          return;
        }
        if (controls && controls.handleKey(e)) {
          e.preventDefault();
          e.stopPropagation();
        }
      }
      document.addEventListener("keydown", onKey, true);
      window.addEventListener("keydown", onKey, true);
      document.addEventListener("tizenhwkey", function (e) {
        if (e && e.keyName === "back") {
          e.preventDefault();
          exit();
        }
      });

      try {
        if (window.tizen && tizen.tvinputdevice) {
          ["Back", "Return", "MediaPlayPause", "MediaPlay", "MediaPause"].forEach(function (k) {
            try { tizen.tvinputdevice.registerKey(k); } catch (e) {}
          });
        }
      } catch (e) {}

      function ok() {
        msg.style.display = "none";
        hint.style.display = "none";
        document.body.focus();
      }
      function fail(t) {
        msg.style.display = "flex";
        msg.textContent = t + "\n\nPress Back to return.";
      }

      if (!u) {
        fail("No stream URL.");
        return;
      }

      var referer = params.get("ref") || params.get("embed") || "";

      if (window.Hls && Hls.isSupported()) {
        var hlsConfig = { enableWorker: false };
        if (referer.startsWith("http")) {
          hlsConfig.xhrSetup = function (xhr) {
            try {
              xhr.setRequestHeader("Referer", referer);
            } catch (e) {}
          };
        }
        var hls = new Hls(hlsConfig);
        hls.loadSource(u);
        hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          v.muted = true;
          v.play().then(function () {
            v.muted = false;
            ok();
          }).catch(function () {
            v.muted = true;
            v.play();
            ok();
          });
        });
        hls.on(Hls.Events.ERROR, function (_, data) {
          if (!data.fatal) return;
          fail("Hls.js: " + (data.details || data.type || "error"));
        });
        return;
      }
      if (v.canPlayType("application/vnd.apple.mpegurl")) {
        v.src = u;
        v.addEventListener("playing", ok);
        v.addEventListener("error", function () {
          fail("Native HLS failed.");
        });
        v.muted = true;
        v.play().catch(function () {});
        return;
      }
      fail("HLS not supported on this TV.");
    })();
  </script>
</body>
</html>
